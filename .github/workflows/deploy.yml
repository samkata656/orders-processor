name: Deploy to GitHub Pages

# Builds the site and publishes it every time you push to main.
# You can also start it by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Lets the workflow publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, finish the running deploy and then run the newest one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
